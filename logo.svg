<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="50%" style="stop-color:#e8c9a0"/>
      <stop offset="100%" style="stop-color:#d4a574"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.4"/>

  <!-- Google Apps Script icon (left side) - script brackets -->
  <g transform="translate(100, 170)">
    <!-- Left curly brace -->
    <path d="M80,0 Q60,0 60,20 L60,60 Q60,80 40,80 Q60,80 60,100 L60,140 Q60,160 80,160"
          fill="none" stroke="#4285F4" stroke-width="12" stroke-linecap="round"/>
    <!-- Code lines -->
    <line x1="95" y1="50" x2="145" y2="50" stroke="#34A853" stroke-width="8" stroke-linecap="round"/>
    <line x1="105" y1="80" x2="155" y2="80" stroke="#FBBC04" stroke-width="8" stroke-linecap="round"/>
    <line x1="95" y1="110" x2="135" y2="110" stroke="#EA4335" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Bridge connecting the two sides -->
  <g transform="translate(220, 235)">
    <!-- Bridge arc -->
    <path d="M0,40 Q35,-15 70,40" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <!-- Bridge deck -->
    <line x1="-5" y1="40" x2="75" y2="40" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <!-- Bridge pillars -->
    <line x1="15" y1="20" x2="15" y2="40" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="20" x2="55" y2="40" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <!-- Data flow dots -->
    <circle cx="35" cy="15" r="4" fill="#4facfe" opacity="0.9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="28" r="3" fill="#00f2fe" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="28" r="3" fill="#00f2fe" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Claude icon (right side) - stylized sparkle/star -->
  <g transform="translate(310, 170)">
    <path d="M60,0 L68,55 L120,65 L68,75 L60,130 L52,75 L0,65 L52,55 Z"
          fill="url(#accent)" opacity="0.9"/>
    <circle cx="60" cy="65" r="18" fill="#1a1a2e"/>
    <circle cx="60" cy="65" r="12" fill="url(#accent)" opacity="0.6"/>
  </g>

  <!-- "ScriptBridge" text -->
  <text x="256" y="395" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white" letter-spacing="1">ScriptBridge</text>

  <!-- Subtitle -->
  <text x="256" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#4facfe" letter-spacing="2" opacity="0.8">MCP CONNECTOR</text>
</svg>
